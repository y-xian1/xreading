<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xreading</title>
<style>
:root{--bg:#f6f4ee;--page:#fdfcf9;--ink:#24252a;--sub:#706f6b;--line:#e4e0d6;--acc:#2b4c7e;--hl:#fff08a;--wave:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#14181d;--page:#1b2027;--ink:#d3d9e0;--sub:#8b97a4;--line:#2b333c;--acc:#8fb0dd;--hl:#6a5e1c;--wave:#e58a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.7 "PingFang SC","Microsoft YaHei",sans-serif}
.en{font-family:Charter,"Iowan Old Style",Georgia,"Noto Serif",serif}
main{max-width:760px;margin:0 auto;padding:24px 20px 120px}
h2{font-size:18px;margin:24px 0 8px}
.sub{color:var(--sub);font-size:14px}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;border-radius:4px;padding:7px 12px;cursor:pointer;color:var(--acc)}
button:hover{background:rgba(120,140,170,.14)}
button.pri{border-bottom:2px solid var(--acc);border-radius:0}
button:disabled{opacity:.35;cursor:default;background:none}
button.lnk{padding:4px 8px}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
textarea,input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 2px}
textarea:focus,input:focus{border-bottom-color:var(--acc)}
textarea{resize:vertical}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:12px 0}
.sp{flex:1}
.bar{display:flex;gap:10px;align-items:center;padding-bottom:10px}
.up{margin:30px 0 8px}
.up .ttl{font-size:22px;font-weight:600;padding:8px 2px}
.up textarea{font-size:18px;line-height:1.75;margin-top:8px;border-bottom:0}
.cont{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.sec{padding:16px 0}.sec.t{border-top:1px solid var(--line)}
button.fill{background:none;color:var(--acc);border:1px solid var(--acc);border-radius:10px;padding:9px 24px}
button.fill:hover{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.srow{padding:6px 0 2px}.srow textarea{font-size:18px;line-height:1.7}
.hist{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hist b{flex:1;font-weight:500;cursor:pointer}
/* 逐句翻译：书页风格，整体居中、文字左对齐 */
.mid{min-height:64vh;display:flex;flex-direction:column;justify-content:center;max-width:640px;margin:0 auto}
.mid.top{justify-content:flex-start;padding-top:12vh}   /* 翻译页：内容从固定位置往下长，加标记或参考译文时原文不会被顶上去 */
.big{font-size:30px;line-height:1.6;text-align:left;border-left:3px solid var(--acc);padding:2px 0 2px 22px;margin-bottom:34px}
textarea.ln{border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;padding:14px 4px;font-size:19px;line-height:1.7}
.ref{margin-top:26px;font-size:18px;color:var(--sub)}
.ref .sub{margin-bottom:2px}
.tag{font-size:12px;color:var(--wave);border:1px solid var(--wave);border-radius:10px;padding:1px 8px;margin-left:8px}
.bar-prog{height:2px;background:var(--line)}.bar-prog i{display:block;height:2px;background:var(--acc)}
.err{color:var(--wave);margin:8px 0}
.nav{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:12px 2px;font-size:16px;border-radius:0;color:var(--ink);border-bottom:1px solid var(--line)}
.nav:last-child{border-bottom:0}
.row+.nav{margin-top:8px}
dialog h2{font-size:16px;margin:10px 0 6px}
.big .s{cursor:text}.big .s:hover{background:none}
.mid .pn-sec{margin-top:30px}
.al{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
/* 全文复习 */
#doc{font-size:20px;line-height:2.1}
#doc p{margin:0 0 1em}
.s{border-radius:3px;cursor:pointer}.s:hover{background:rgba(120,140,170,.14)}.s.on{background:rgba(120,140,170,.24)}
.mk{cursor:pointer}
.m-hl{background:var(--hl)}
.m-ul{text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-skip-ink:none}
.m-wv{text-decoration:underline wavy var(--wave);text-underline-offset:4px;text-decoration-skip-ink:none}  /* skip-ink:none = 线不再在 g y j 等字母处断开 */
.m-no{border-bottom:1px dotted var(--sub)}
#tb{position:fixed;display:none;gap:4px;background:var(--ink);padding:5px;border-radius:8px;z-index:9}
#tb button{background:none;border:0;color:var(--page);padding:4px 10px;border-radius:4px}
/* 句子详情栏：放在右侧，字号加大 */
#panel{position:fixed;top:0;right:0;bottom:0;width:430px;overflow:auto;background:var(--bg);border-left:1px solid var(--line);padding:26px 30px 40px;font-size:18px;line-height:1.75}
body.pn{padding-right:430px}
.pn-en{font-size:23px;line-height:1.6;border-left:3px solid var(--acc);padding:2px 0 2px 16px;margin:16px 0 22px}
.pn-sec{margin:20px 0 2px;font-size:14px;color:var(--sub)}
.pn-t{font-size:19px}
.pn-mk{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.pn-mk textarea{font-size:17px;background:var(--page);border:1px solid var(--line);border-radius:6px;padding:10px}
@media(max-width:900px){#panel{top:auto;left:0;width:auto;max-height:55vh;border-left:0;border-top:1px solid var(--line)}body.pn{padding-right:0}}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--page);color:var(--ink);max-width:440px;width:92%;max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.35)}
</style>
</head>
<body>
<main id="app"></main>
<div id="tb"></div>
<dialog id="dlg"></dialog>

<script>
/* =====================================================
   模块 1：存储（以后换成云端，只需改这一块）
   数据结构：db = { articles:[...], cfg:{baseUrl,key,model} }
   ===================================================== */
const Store = {
  K: 'reader-v1',
  load() { try { return JSON.parse(localStorage.getItem(this.K)) || { articles: [], cfg: {} }; } catch (e) { return { articles: [], cfg: {} }; } },
  save() { try { localStorage.setItem(this.K, JSON.stringify(db)); } catch (e) { alert('保存失败：浏览器存储空间可能已满'); } }
};
let db = Store.load();


/* =====================================================
   模块 1.5：文件夹备份（把每篇文章自动写成一个 .json 文件）
   只有 Chrome / Edge 支持 showDirectoryPicker；其他浏览器用手动导出。
   浏览器本地存储仍是「主数据」，文件夹是自动更新的备份/同步副本。
   API Key 不会写进文件。
   ===================================================== */
const idb = (mode, fn) => new Promise((res, rej) => {   // 用 IndexedDB 记住你选的文件夹
  const r = indexedDB.open('reader-fs', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('k');
  r.onsuccess = () => { const tx = r.result.transaction('k', mode), q = fn(tx.objectStore('k')); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); };
  r.onerror = () => rej(r.error);
});
const Folder = {
  sup: 'showDirectoryPicker' in window && window.self === window.top,
  st: 'none',           // none 未设置 | ok 可用 | needperm 需要重新授权 | unsupported 不支持
  h: null, dirty: new Set(), names: {}, t: null, last: 0, err: '',
  get name() { return this.h ? this.h.name : ''; },
  async init() {
    if (!this.sup) { this.st = 'unsupported'; return; }
    try {
      this.h = await idb('readonly', s => s.get('dir'));
      if (this.h) this.st = (await this.h.queryPermission({ mode: 'readwrite' })) === 'granted' ? 'ok' : 'needperm';
    } catch (e) { this.h = null; }
  },
  async choose() { this.h = await showDirectoryPicker({ mode: 'readwrite' }); await idb('readwrite', s => s.put(this.h, 'dir')); this.st = 'ok'; this.names = {}; },
  async regrant() { this.st = (await this.h.requestPermission({ mode: 'readwrite' })) === 'granted' ? 'ok' : 'needperm'; },
  queue(a) { this.dirty.add(a.id); clearTimeout(this.t); this.t = setTimeout(() => this.flush(), 800); },   // 改动后稍等一下再写，避免打字时频繁写
  async flush() {
    if (this.st !== 'ok') return;
    for (const id of [...this.dirty]) {
      this.dirty.delete(id);
      const a = db.articles.find(x => x.id === id); if (!a) continue;
      try {
        const name = (a.title.replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40) || 'article') + '-' + id + '.json';
        if (this.names[id] !== name) { for await (const [n] of this.h.entries()) if (n !== name && n.endsWith('-' + id + '.json')) await this.h.removeEntry(n); }  // 标题改了：删掉旧文件名
        const w = await (await this.h.getFileHandle(name, { create: true })).createWritable();
        await w.write(JSON.stringify({ app: 'reader', v: 1, article: a }, null, 1)); await w.close();
        this.names[id] = name; this.last = Date.now(); this.err = '';
      } catch (e) { this.err = (e.name || '') + ' ' + (e.message || ''); if (e.name === 'NotAllowedError') this.st = 'needperm'; }
    }
  },
  async all() { db.articles.forEach(a => this.dirty.add(a.id)); await this.flush(); },
  async count() { let n = 0; try { for await (const [k] of this.h.entries()) if (k.endsWith('.json')) n++; } catch (e) {} return n; },
  async remove(id) { if (this.st !== 'ok') return; try { for await (const [n] of this.h.entries()) if (n.endsWith('-' + id + '.json')) await this.h.removeEntry(n); } catch (e) {} },
  async read() {
    const out = [];
    for await (const [n, e] of this.h.entries()) if (e.kind === 'file' && n.endsWith('.json')) { try { out.push(JSON.parse(await (await e.getFile()).text())); } catch (x) {} }
    return out;
  },
  // 同步：先把文件夹里「更新时间更新」的文章合并进来，再把全部文章写回文件夹
  async sync() { const m = mergeIn(await this.read()); db.articles.forEach(a => this.dirty.add(a.id)); await this.flush(); return m; }
};
// 合并文章列表（来自文件夹或导入文件）：没有的就添加，同一篇取更新时间较新的
function mergeIn(list) {
  let add = 0, upd = 0;
  list.forEach(x => (x.articles || [x.article || x]).forEach(a => {
    if (!a || !a.id || !Array.isArray(a.sents)) return;
    const i = db.articles.findIndex(y => y.id === a.id);
    if (i < 0) { db.articles.push(a); add++; } else if ((a.upd || 0) > (db.articles[i].upd || 0)) { db.articles[i] = a; upd++; }
  }));
  Store.save(); return { add, upd };
}

/* =====================================================
   模块 2：句子切分
   规则：在 . ? ! 之后、且后面是大写字母/数字/引号时切开；
   遇到 Mr. Dr. e.g. U.S. 以及单个大写字母（人名缩写）时不切。
   ===================================================== */
const ABBR = /^(Mr|Mrs|Ms|Dr|Prof|Sr|Jr|St|vs|etc|e\.g|i\.e|No|Fig|Inc|Ltd|Co|U\.S|a\.m|p\.m|Mt|Gen|Rev)$/i;
function splitText(text) {
  const out = [];
  text.split(/\n\s*\n/).forEach(par => {
    par = par.replace(/\s+/g, ' ').trim();
    if (!par) return;
    const re = /[.!?]+["'”’)\]]*\s+(?=["'“‘(\[]?[A-Z0-9])|[.!?]+["'”’)\]]*$/g;
    let start = 0, first = true, m;
    while ((m = re.exec(par))) {
      const last = (par.slice(start, m.index).match(/(\S+)$/) || [''])[0];
      if (m[0][0] === '.' && (ABBR.test(last) || /^[A-Z]$/.test(last))) continue;
      const end = m.index + m[0].length;
      out.push({ en: par.slice(start, end).trim(), p: first });
      first = false; start = end;
    }
    if (start < par.length) out.push({ en: par.slice(start).trim(), p: first });
  });
  return out;
}

// 中文译文切分：按 。！？ 切开，引号收尾的一起保留；段落之间也会断开
function splitZh(text) {
  const out = [];
  text.split(/\n+/).forEach(par => { (par.trim().match(/.+?(?:[。！？!?…]+[”’」』）)]*|$)/g) || []).forEach(x => x.trim() && out.push(x.trim())); });
  return out;
}

// 自动对齐：英文句子与中文句子的「长度比例」大致固定。
// 用动态规划找出整体最合理的配对方式，允许 1对1、1对2、2对1 等情况（译者拆句/并句）。
// 返回 { out: 每个英文句对应的中文, flag: 哪些句子不是 1对1（需要人看一眼） }
function alignLen(en, zh) {
  const n = en.length, m = zh.length, W = m + 1;
  const pe = [0], pz = [0];
  en.forEach(s => pe.push(pe[pe.length - 1] + s.length));
  zh.forEach(s => pz.push(pz[pz.length - 1] + s.length));
  const c = pz[m] / Math.max(pe[n], 1);                    // 全文平均：每个英文字符对应多少中文字符
  const moves = [[1, 1, .1], [1, 2, 2.4], [2, 1, 2.4], [2, 2, 4.5], [1, 3, 4], [3, 1, 4], [1, 0, 4.6], [0, 1, 4.6]]; // [英文句数, 中文句数, 罕见程度惩罚]
  const D = new Float64Array((n + 1) * W).fill(Infinity), B = new Int8Array((n + 1) * W).fill(-1);
  D[0] = 0;
  for (let i = 0; i <= n; i++) for (let j = 0; j <= m; j++) {
    const d0 = D[i * W + j]; if (d0 === Infinity) continue;
    moves.forEach(([di, dj, pen], k) => {
      const ni = i + di, nj = j + dj; if (ni > n || nj > m) return;
      const a = (pe[ni] - pe[i]) * c, b = pz[nj] - pz[j], dev = (b - a) / Math.sqrt(Math.max(a, 1) * 6.8);
      const v = d0 + pen + dev * dev / 2;
      if (v < D[ni * W + nj]) { D[ni * W + nj] = v; B[ni * W + nj] = k; }
    });
  }
  const beads = []; let i = n, j = m;
  while (i > 0 || j > 0) { const [di, dj] = moves[B[i * W + j]]; beads.unshift([i - di, j - dj, i, j]); i -= di; j -= dj; }
  const out = Array(n).fill(''), flag = Array(n).fill(false);
  beads.forEach(([i0, j0, i1, j1]) => {
    if (i1 === i0) { const t = Math.max(i0 - 1, 0); out[t] += zh.slice(j0, j1).join(''); flag[t] = true; return; } // 多出的中文并入上一句
    if (i1 - i0 === j1 - j0) for (let k = 0; k < i1 - i0; k++) out[i0 + k] = zh[j0 + k];
    else out[i0] = zh.slice(j0, j1).join('');
    if (i1 - i0 !== 1 || j1 - j0 !== 1) for (let k = i0; k < i1; k++) flag[k] = true;
  });
  return { out, flag };
}

/* =====================================================
   模块 3：翻译（与学习流程完全分离）
   所有翻译来源都实现同一个接口：(句子数组) => Promise<译文数组>
   以后要换服务，只需新增一个函数，并放进 Translators。
   ===================================================== */
// 统一的接口调用：失败时说清楚是哪一步出了问题
async function chat(messages) {
  const { baseUrl, key, model } = db.cfg;
  if (!baseUrl || !key || !model) throw new Error('请先在「设置」里填写接口地址、Key 和模型名');
  let r;
  try {
    r = await fetch(baseUrl.replace(/\/+$/, '') + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
      body: JSON.stringify({ model, temperature: 0.2, messages })
    });
  } catch (e) {
    throw new Error('没有连上服务器（还没到验证 Key 那一步）。请检查地址是否填对、网络是否能访问该服务；若都没问题，可能是浏览器拦截了跨域请求。');
  }
  if (!r.ok) {
    let d = ''; try { d = (await r.json()).error.message; } catch (e) {}
    const why = { 401: 'Key 无效或填错了', 402: '账户余额不足', 404: '地址不对（试试加上或去掉 /v1）', 429: '请求太频繁，稍后再试' }[r.status] || '';
    throw new Error('服务器返回 ' + r.status + (why ? '：' + why : '') + (d ? '（' + d + '）' : ''));
  }
  return (await r.json()).choices[0].message.content;
}
const Translators = {
  // OpenAI 兼容接口（DeepSeek、OpenAI、各类中转服务等都可以）
  async api(list, onProgress) {
    const res = [], N = 15; // 每批 15 句，降低出错概率
    for (let i = 0; i < list.length; i += N) {
      const batch = list.slice(i, i + N);
      const txt = await chat([
        { role: 'system', content: '你是英译中翻译。把用户给出的 JSON 数组中的每个英文句子翻译成通顺准确的中文。只返回一个 JSON 字符串数组，长度和顺序必须与输入完全一致，不要任何解释。' },
        { role: 'user', content: JSON.stringify(batch) }]);
      let arr;
      try { arr = JSON.parse(txt.slice(txt.indexOf('['), txt.lastIndexOf(']') + 1)); } catch (e) { throw new Error('模型返回的格式无法解析，请重试'); }
      if (arr.length !== batch.length) throw new Error('译文数量与句子数量不一致，请重试');
      res.push(...arr.map(String));
      onProgress(Math.min(i + N, list.length), list.length);
    }
    return res;
  },
  // 导入：整篇中文译文，自动切分（对不齐时进入对齐页）
  import: text => splitZh(text)
};

/* =====================================================
   模块 4：界面（视图 + 事件）
   ===================================================== */
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cur = () => db.articles.find(a => a.id === V.id);
const allDone = a => a.sents.every(s => s.ok);
const hasRef = a => a.sents.every(s => s.ref);
let V = { view: 'home' }, draft = null, msg = '', busy = false;
const go = (o) => { V = o; msg = ''; if (o.id) { db.last = o.id; Store.save(); } render(); window.scrollTo(0, 0); };   // db.last：最近打开的文章，下次打开网页直接回到这里

// 打开文章：按实际进度决定进入哪里
function openArticle(id) {
  const a = db.articles.find(x => x.id === id);
  if (!hasRef(a)) return go({ view: 'gen', id });
  go({ view: allDone(a) ? 'review' : 'study', id });
}

function render() {
  $('#tb').style.display = 'none';
  ({ home, check, gen, study, review, align }[V.view])();
  document.body.classList.toggle('pn', V.view === 'review' && V.sel != null);
}

/* ---------- 首页 ---------- */
function home() {
  const todo = db.articles.filter(a => !allDone(a)).sort((x, y) => y.upd - x.upd)[0];
  const up = `<div class="up"><input class="ttl" id="ttl" placeholder="标题（可不填）">
    <textarea class="en" id="txt" rows="10" placeholder="在这里粘贴英文文章…"></textarea>
    <div class="row"><button data-act="file">选择 .txt 文件</button><input type="file" id="fi" accept=".txt" hidden>
    <span class="sp"></span><button data-act="new" data-c="1">检查切分结果</button><button class="pri" data-act="new">直接开始</button></div>${msg ? `<div class="err">${msg}</div>` : ''}</div>`;
  const cont = todo ? `<div class="cont"><b style="font-size:18px;font-weight:600">${esc(todo.title)}</b>
    <span class="sub">${todo.sents.filter(s => s.ok).length} / ${todo.sents.length} 句</span><span class="sp"></span><button class="pri" data-act="open" data-id="${todo.id}">继续学习</button></div>` : '';
  const hist = db.articles.length ? `<details><summary class="sub" style="cursor:pointer">历史记录（${db.articles.length}）</summary>${db.articles.map(a =>
    `<div class="hist"><b data-act="open" data-id="${a.id}">${esc(a.title)}</b><span class="sub">${a.sents.filter(s => s.ok).length}/${a.sents.length}</span>
    <button class="lnk" data-act="ren" data-id="${a.id}">改名</button><button class="lnk" data-act="del" data-id="${a.id}">删除</button></div>`).join('')}</details>` : '';
  app.innerHTML = `<div class="row"><span class="sp"></span>${Folder.st === 'needperm' ? '<button class="lnk" data-act="reperm">本地备份：点击恢复授权</button>' : ''}<button data-act="cfg">设置</button></div>
    <div class="mid">${todo ? cont + up : up + cont}</div>${hist}`;
}

/* ---------- 切分检查（可选） ---------- */
function check() {
  const a = cur();
  if (!draft) draft = a.sents.map(s => ({ ...s }));
  app.innerHTML = `<div class="bar"><b>检查切分</b><span class="sub">共 ${draft.length} 句</span><span class="sp"></span><button class="pri" data-act="chkdone">完成检查</button></div>
    <p class="sub">把光标放在句子中想断开的位置，点「在光标处拆分」。</p>` +
    draft.map((s, i) => `<div class="srow en"><textarea data-d="${i}" rows="2">${esc(s.en)}</textarea><div class="row" style="margin:2px 0 0">
    <button class="lnk" data-act="split" data-i="${i}">在光标处拆分</button>${i < draft.length - 1 ? `<button class="lnk" data-act="merge" data-i="${i}">与下一句合并</button>` : ''}</div></div>`).join('');
}

/* ---------- 生成参考译文 ---------- */
function gen() {
  const a = cur(), n = a.sents.length;
  app.innerHTML = `<div class="bar"><b>${esc(a.title)}</b><span class="sub">${n} 句</span><span class="sp"></span><button data-act="cfg">设置</button><button data-act="home">首页</button></div>
    <div class="mid"><h2>生成参考译文</h2>
    <div class="sec t"><button class="fill" data-act="genapi" ${busy ? 'disabled' : ''}>${busy ? '生成中…' : '用 API 生成'}</button> <span class="sub" id="pg"></span></div>
    <div class="sec"><div class="sub">或者粘贴整篇中文译文，系统自动切分并对齐</div>
    <textarea id="imp" rows="6" placeholder="在这里粘贴中文译文…"></textarea><div class="row"><button class="pri" data-act="genimp">导入</button></div></div>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}</div>`;
}

/* ---------- 对齐中文译文 ---------- */
function align() {
  const a = cur(), n = a.sents.length, z = V.zh, m = z.length, F = V.flag;
  const nf = F ? F.filter(Boolean).length : 0, show = i => !(F && V.only) || F[i] || F[i - 1] || F[i + 1];
  app.innerHTML = `<div class="bar"><b>对齐译文</b><span class="sub">英文 ${n} 句 / 中文 ${m} 条</span><span class="sp"></span>
    ${F ? `<button data-act="zonly">${V.only ? '显示全部' : '只看需确认的'}</button>` : ''}<button data-act="tgen">返回</button><button class="pri" data-act="zok" ${n === m ? '' : 'disabled'}>确认对齐</button></div>
    <p class="sub">${F ? `已自动对齐。有 ${nf} 句拆分或合并过（用色块标出），其余位置已按顺序对上。看一眼标出的地方，不对就直接改右边文字，然后确认。` : n === m ? '数量一致，可以确认。' : '数量不一致：多出的请合并，缺少的请拆分；也可以在某句前插入空白，让后面的整体下移。'}</p>` +
    Array.from({ length: Math.max(n, m) }, (_, i) => i < Math.max(n, m) && show(i) ? `<div class="al" ${F && F[i] ? 'style="background:rgba(255,224,102,.22)"' : ''}><div class="en">${i < n ? esc(a.sents[i].en) : ''}</div><div>
      <textarea data-z="${i}" rows="2" ${i < m ? '' : 'disabled'}>${i < m ? esc(z[i]) : ''}</textarea>
      ${i < m ? `<button class="lnk" data-act="zsplit" data-i="${i}">拆分</button>${i < m - 1 ? `<button class="lnk" data-act="zmerge" data-i="${i}">合并下一条</button>` : ''}<button class="lnk" data-act="zins" data-i="${i}">此前插入空白</button><button class="lnk" data-act="zdel" data-i="${i}">删除</button>` : ''}</div></div>` : '').join('');
}

/* ---------- 逐句翻译 ---------- */
function study() {
  const a = cur(), i = a.pos, s = a.sents[i], n = a.sents.length;
  const val = s.draft ?? s.my ?? '';
  app.innerHTML = `<div class="bar"><button class="lnk" data-act="home">首页</button><b class="sp" style="font-weight:500">${esc(a.title)}</b>
    <span class="sub">${i + 1} / ${n}</span><button data-act="review">全文</button></div>
    <div class="bar-prog"><i style="width:${(a.sents.filter(x => x.ok).length / n) * 100}%"></i></div>
    <div class="mid top"><div class="big en"><span class="s" data-s="${i}">${segs(s)}</span></div>
    <textarea id="my" class="ln" rows="3" placeholder="写下你的翻译（Ctrl+Enter 确认）">${esc(val)}</textarea>
    <div class="row"><button class="pri" data-act="ok">${s.ok ? '更新译文' : '确认'}</button>${s.edited ? '<span class="tag">已修改</span>' : ''}
    <span class="sp"></span><button data-act="prev" ${i === 0 ? 'disabled' : ''}>上一句</button><button data-act="next" ${s.ok ? '' : 'disabled'}>${i === n - 1 ? '完成' : '下一句'}</button></div>
    ${s.ok ? `<div class="ref"><div class="sub">参考译文</div>${esc(s.ref)}</div>` : ''}${markList(s)}</div>`;
  $('#my').focus();
}

/* ---------- 全文复习 ---------- */
function segs(s) {
  const t = s.en, cuts = new Set([0, t.length]);
  s.marks.forEach(m => { cuts.add(m.a); cuts.add(m.b); });
  const c = [...cuts].sort((x, y) => x - y); let h = '';
  for (let k = 0; k < c.length - 1; k++) {
    const cov = s.marks.map((m, j) => [m, j]).filter(([m]) => m.a <= c[k] && m.b >= c[k + 1]), txt = esc(t.slice(c[k], c[k + 1]));
    h += cov.length ? `<span class="mk ${cov.map(([m]) => 'm-' + m.t).join(' ')}" data-mk="${cov[0][1]}">${txt}</span>` : txt;
  }
  return h;
}
function review() {
  const a = cur();
  let body = '<p>';
  a.sents.forEach((s, i) => { body += (s.p && i ? '</p><p>' : '') + `<span class="s${V.sel === i ? ' on' : ''}" data-s="${i}">${segs(s)}</span> `; });
  app.innerHTML = `<div class="bar"><button class="lnk" data-act="home">首页</button><b class="sp" style="font-weight:500">${esc(a.title)}</b>
    ${allDone(a) ? '' : '<button class="pri" data-act="back">回到学习位置</button>'}</div>
    <div id="doc" class="en">${body}</p></div>${V.sel != null ? panel(a.sents[V.sel]) : ''}`;
}
// 标记与备注列表（全文详情栏、逐句翻译页共用）
function markList(s) {
  return (s.marks.length ? '<div class="pn-sec" style="margin-top:28px">标记与备注</div>' : '') +
    s.marks.map((m, j) => `<div class="pn-mk"><div class="row" style="margin:0 0 6px"><span class="mk m-${m.t}">${esc(s.en.slice(m.a, m.b))}</span><span class="sp"></span>
    <button class="lnk" data-act="delmk" data-j="${j}">删除</button></div><textarea data-note="${j}" rows="3" placeholder="写备注（可不写）">${esc(m.note || '')}</textarea></div>`).join('');
}
function panel(s) {
  return `<div id="panel"><div class="row" style="margin:0"><span class="sub">句子详情</span><span class="sp"></span><button class="lnk" data-act="close">关闭</button></div>
    <div class="pn-en en">${esc(s.en)}</div>
    <div class="pn-sec">我的译文${s.edited ? '<span class="tag">已修改</span>' : ''}</div><div class="pn-t">${esc(s.my || '（还没翻译）')}</div>
    <div class="pn-sec">参考译文</div><div class="pn-t">${esc(s.ref || '')}</div>
    ${markList(s)}</div>`;
}

// 设置窗口：cfgView = main（两个入口）| api | data
let cfgView = 'main';

}

/* =====================================================
   模块 5：事件（所有按钮通过 data-act 分发到这里）
   ===================================================== */
const stamp = a => { a.upd = Date.now(); Store.save(); Folder.queue(a); };
const A = {
  file() { $('#fi').click(); },
  new(el) {
    const text = $('#txt').value.trim();
    if (!text) { msg = '请先粘贴英文文章'; return render(); }
    const sents = splitText(text).map(s => ({ en: s.en, p: s.p, ref: '', my: '', ok: false, edited: false, marks: [] }));
    const a = { id: 'a' + Date.now(), title: $('#ttl').value.trim() || sents[0].en.slice(0, 30), created: Date.now(), upd: Date.now(), pos: 0, sents };
    db.articles.push(a); Store.save(); Folder.queue(a); draft = null;
    go(el.dataset.c ? { view: 'check', id: a.id } : { view: 'gen', id: a.id });
  },
  open: el => openArticle(el.dataset.id),
  ren(el) { const a = db.articles.find(x => x.id === el.dataset.id), t = prompt('新标题', a.title); if (t && t.trim()) { a.title = t.trim(); Store.save(); Folder.queue(a); render(); } },
  del(el) { if (confirm('确定删除这篇文章及其所有笔记？')) { db.articles = db.articles.filter(x => x.id !== el.dataset.id); if (db.last === el.dataset.id) db.last = null; Store.save(); Folder.remove(el.dataset.id); render(); } },
  home() { go({ view: 'home' }); },
  // 检查切分：拆分 / 合并（此时还没有译文，所以不会错位）
  split(el) {
    const i = +el.dataset.i, t = document.querySelector(`[data-d="${i}"]`), pos = t.selectionStart, v = t.value;
    if (pos <= 0 || pos >= v.length) return alert('请先把光标放到句子中间');
    draft[i].en = v.slice(0, pos).trim(); draft.splice(i + 1, 0, { ...draft[i], en: v.slice(pos).trim(), p: false }); render();
  },
  merge(el) { const i = +el.dataset.i; draft[i].en = (draft[i].en + ' ' + draft[i + 1].en).trim(); draft.splice(i + 1, 1); render(); },
  chkdone() { const a = cur(); a.sents = draft.filter(s => s.en); draft = null; stamp(a); go({ view: 'gen', id: a.id }); },
  // 生成译文
  async genapi() {
    const a = cur(); busy = true; msg = ''; gen();
    try {
      const r = await Translators.api(a.sents.map(s => s.en), (d, n) => { const p = $('#pg'); if (p) p.textContent = `${d} / ${n}`; });
      a.sents.forEach((s, i) => s.ref = r[i]); stamp(a); busy = false; go({ view: 'study', id: a.id });
    } catch (e) { busy = false; msg = e.message + '（可点击再次尝试）'; gen(); }
  },
  genimp() {
    const a = cur(), z = Translators.import($('#imp').value);
    if (!z.length) { msg = '请先粘贴中文译文'; return gen(); }
    const r = alignLen(a.sents.map(s => s.en), z);   // 即使句数相同也检查：一处拆句加一处并句，数量会恰好抵消
    if (!r.flag.some(Boolean)) { a.sents.forEach((s, i) => s.ref = r.out[i]); stamp(a); go({ view: 'study', id: a.id }); }
    else go({ view: 'align', id: a.id, zh: r.out, flag: r.flag, only: true });  // 有不确定的地方：先自动对齐，再让你确认标出的位置
  },
  tgen() { go({ view: 'gen', id: V.id }); },
  zsplit(el) {
    const i = +el.dataset.i, t = document.querySelector(`[data-z="${i}"]`), p = t.selectionStart, v = t.value;
    if (p <= 0 || p >= v.length) return alert('请先把光标放到句子中间');
    V.zh.splice(i, 1, v.slice(0, p).trim(), v.slice(p).trim()); V.flag = null; render();
  },
  zmerge(el) { const i = +el.dataset.i; V.zh.splice(i, 2, V.zh[i] + V.zh[i + 1]); V.flag = null; render(); },
  zins(el) { V.zh.splice(+el.dataset.i, 0, ''); V.flag = null; render(); },
  zonly() { V.only = !V.only; render(); },
  zdel(el) { V.zh.splice(+el.dataset.i, 1); V.flag = null; render(); },
  zok() { const a = cur(); a.sents.forEach((s, i) => s.ref = V.zh[i].trim() || '（此句没有单独译文）'); stamp(a); go({ view: 'study', id: a.id }); },
  // 逐句学习
  ok() {
    const a = cur(), s = a.sents[a.pos], v = $('#my').value.trim();
    if (!v) return;
    if (s.ok && v !== s.my) s.edited = true; // 确认后再改，就标「已修改」
    s.my = v; s.ok = true; delete s.draft; stamp(a); study();
  },
  next() { const a = cur(); if (a.pos < a.sents.length - 1) { a.pos++; stamp(a); study(); } else go({ view: 'review', id: a.id }); },
  prev() { const a = cur(); if (a.pos > 0) { a.pos--; stamp(a); study(); } },
  review() { V = { view: 'review', id: V.id }; render(); },
  back() { const a = cur(), k = a.sents.findIndex(s => !s.ok); if (k >= 0) a.pos = k; go({ view: 'study', id: a.id }); },
  close() { V.sel = null; render(); },
  delmk(el) { const a = cur(), s = a.sents[V.view === 'study' ? a.pos : V.sel]; s.marks.splice(+el.dataset.j, 1); stamp(a); render(); },
  cfg() { cfgView = 'main'; fillCfg(); const d = $('#dlg'); if (!d.open) d.showModal(); },
  cfgnav(el) { cfgView = el.dataset.v; fillCfg(); },
  async fnow() { await Folder.all(); fillCfg(Folder.err ? '备份失败：' + Folder.err : `已备份 ${db.articles.length} 篇到「${Folder.name}」`); },
  async fchoose() {
    try { await Folder.choose(); const m = await Folder.sync(); fillCfg(`已选择「${Folder.name}」，现有文章已备份${m.add + m.upd ? `；并从文件夹读取了 ${m.add + m.upd} 篇` : ''}`); }
    catch (e) { fillCfg(e.name === 'AbortError' ? '' : '选择失败：' + e.message); }
  },
  async reperm() {
    try { await Folder.regrant(); if (Folder.st === 'ok') await Folder.sync(); } catch (e) {}
    if ($('#dlg').open) fillCfg(Folder.st === 'ok' ? '已恢复授权' : '没有获得授权'); else render();
  },
  async frestore() {
    try { if (Folder.st !== 'ok') await Folder.regrant(); const m = await Folder.sync(); fillCfg(`读取完成：新增 ${m.add} 篇，更新 ${m.upd} 篇`); }
    catch (e) { fillCfg('读取失败：' + e.message); }
  },
  fexp() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: 'reader', v: 1, articles: db.articles }, null, 1)], { type: 'application/json' }));
    a.download = 'reader-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
  },
  fimp() { $('#imf').click(); },
  cfgp() { $('#c1').value = 'https://api.deepseek.com'; $('#c3').value = 'deepseek-flash'; db.cfg = { baseUrl: $('#c1').value, key: $('#c2').value.trim(), model: $('#c3').value }; Store.save(); },
  async cfgt() {
    db.cfg = { baseUrl: $('#c1').value.trim(), key: $('#c2').value.trim(), model: $('#c3').value.trim() }; Store.save();
    const o = $('#ct'); o.textContent = '测试中…'; o.className = 'sub';
    try { await chat([{ role: 'user', content: '回复“好”' }]); o.textContent = '连接成功'; }
    catch (e) { o.textContent = e.message; o.className = 'err'; }
  },
  cfgx() { $('#dlg').close(); }
};
document.addEventListener('click', e => {
  const mk = e.target.closest('[data-mk]'), sn = e.target.closest('[data-s]');
  if (V.view === 'review' && !e.target.closest('#panel,#tb') && sn && !getSelection().toString()) { V.sel = +sn.dataset.s; return render(); }
  const el = e.target.closest('[data-act]');
  if (el && A[el.dataset.act]) A[el.dataset.act](el);
});
document.addEventListener('input', e => {
  if (['c1', 'c2', 'c3'].includes(e.target.id)) { db.cfg = { baseUrl: $('#c1').value.trim(), key: $('#c2').value.trim(), model: $('#c3').value.trim() }; Store.save(); return; }   // 接口信息：输入即保存
  const t = e.target, a = V.id && cur();
  if (t.id === 'my') { a.sents[a.pos].draft = t.value; stamp(a); }               // 自动保存草稿
  else if (t.dataset.z != null) V.zh[+t.dataset.z] = t.value;
  else if (t.dataset.d != null) draft[+t.dataset.d].en = t.value;
  else if (t.dataset.note != null) { a.sents[V.view === 'study' ? a.pos : V.sel].marks[+t.dataset.note].note = t.value; stamp(a); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && V.view === 'study') A.ok(); });
document.addEventListener('change', async e => {
  if (e.target.id === 'imf') {
    const list = [];
    for (const f of e.target.files) { try { list.push(JSON.parse(await f.text())); } catch (x) {} }
    const m = mergeIn(list); m.add + m.upd && [...db.articles].forEach(a => Folder.queue(a));
    fillCfg(`导入完成：新增 ${m.add} 篇，更新 ${m.upd} 篇`); return;
  }
  if (e.target.id !== 'fi' || !e.target.files[0]) return;
  const f = e.target.files[0], r = new FileReader();
  r.onload = () => { $('#txt').value = r.result; if (!$('#ttl').value) $('#ttl').value = f.name.replace(/\.txt$/i, ''); };
  r.readAsText(f);
});

/* ---------- 选中文字 → 标记工具条（位置用「句内字符偏移」记录，同一单词多次出现也不会混） ---------- */
let pend = null;
document.addEventListener('mouseup', e => {
  if (!['review', 'study'].includes(V.view) || e.target.closest('#tb,#panel')) return;
  const sel = getSelection(), tb = $('#tb');
  tb.style.display = 'none'; pend = null;
  if (sel.isCollapsed || !sel.rangeCount) return;
  const r = sel.getRangeAt(0), el = r.startContainer.parentElement.closest('.s'), el2 = r.endContainer.parentElement.closest('.s');
  if (!el || el !== el2) return;
  const pre = document.createRange(); pre.selectNodeContents(el); pre.setEnd(r.startContainer, r.startOffset);
  const a = pre.toString().length, b = a + r.toString().length;
  if (b <= a) return;
  pend = { i: +el.dataset.s, a, b };
  const rc = r.getBoundingClientRect();
  tb.innerHTML = '<button data-m="hl">荧光笔</button><button data-m="ul">下划线</button><button data-m="wv">波浪线</button><button data-m="no">备注</button>';
  tb.style.cssText = `display:flex;left:${Math.max(8, rc.left)}px;top:${Math.max(8, rc.top - 46)}px`;
});
$('#tb').addEventListener('mousedown', e => e.preventDefault());
$('#tb').addEventListener('click', e => {
  const t = e.target.dataset.m; if (!t || !pend) return;
  const a = cur(); a.sents[pend.i].marks.push({ a: pend.a, b: pend.b, t, note: '' });
  const k = a.sents[pend.i].marks.length - 1;
  stamp(a); if (V.view === 'review') V.sel = pend.i; getSelection().removeAllRanges(); render();
  if (t === 'no') { const n = document.querySelector(`[data-note="${k}"]`); n && n.focus(); }   // 点「备注」后直接进入输入
});

// 启动：读取已选的文件夹；如果可用，先合并文件夹里更新的内容（也就是跨设备同步）
Folder.init().then(async () => {
  let changed = false;
  if (Folder.st === 'ok') { try { const m = await Folder.sync(); changed = m.add + m.upd > 0; } catch (e) {} }
  if (changed && V.id && cur()) openArticle(V.id); else if (V.view === 'home') render();
});
navigator.storage && navigator.storage.persist && navigator.storage.persist();   // 请求浏览器尽量不要自动清理本站数据
// 默认页面：如果有最近学习的文章，打开网页就直接回到那里（学习页或全文页）；第一次使用才显示首页
db.articles.some(a => a.id === db.last) ? openArticle(db.last) : render();
</script>
</body>
</html>
